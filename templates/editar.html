{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">Editar Producto</h2>


<form method="POST">

    <div class="mb-3">

        <label class="form-label">
            Nombre
        </label>

        <input
            type="text"
            name="nombre"
            class="form-control"
            value="{{ producto.nombre }}"
            required>

    </div>


    <h5>Presentación</h5>

    <div class="row">

        <div class="col-md-6 mb-3">

            <label class="form-label">
                Cantidad
            </label>

            <input
                type="number"
                name="cantidad"
                class="form-control"
                value="{{ producto.presentacion.cantidad }}"
                required>

        </div>


        <div class="col-md-6 mb-3">

            <label class="form-label">
                Unidad
            </label>

            <select
                name="unidad"
                class="form-select"
                required>

                <option value="Ml"
                    {% if producto.presentacion.unidad == 'Ml' %}
                    selected
                    {% endif %}>
                    Ml
                </option>

                <option value="L"
                    {% if producto.presentacion.unidad == 'L' %}
                    selected
                    {% endif %}>
                    L
                </option>

                <option value="Gr"
                    {% if producto.presentacion.unidad == 'Gr' %}
                    selected
                    {% endif %}>
                    Gr
                </option>

                <option value="Kg"
                    {% if producto.presentacion.unidad == 'Kg' %}
                    selected
                    {% endif %}>
                    Kg
                </option>

                <option value="Unidad"
                    {% if producto.presentacion.unidad == 'Unidad' %}
                    selected
                    {% endif %}>
                    Unidad
                </option>

            </select>

        </div>

    </div>


    <div class="mb-3">

        <label class="form-label">
            Precio
        </label>

        <input
            type="number"
            name="precio"
            class="form-control"
            step="0.01"
            min="0"
            value="{{ producto.precio }}"
            required>

    </div>


    <div class="mb-3">

        <label class="form-label">
            Proveedor
        </label>

        <input
            type="text"
            name="proveedor"
            class="form-control"
            value="{{ producto.proveedor }}"
            required>

    </div>


    <button
        type="submit"
        class="btn btn-primary">

        Guardar Cambios

    </button>


    <a
        href="{{ url_for('index') }}"
        class="btn btn-secondary">

        Cancelar

    </a>

</form>

{% endblock %}
